<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruletka — Zakręć kołem i sprawdź swoje szczęście</title>
  <meta name="description" content="Ruletka: zakręć kołem i sprawdź swoje szczęście.">
  <meta name="theme-color" content="#0b3d2e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Ruletka</h1>
      <p class="tagline">Zakręć kołem i sprawdź swoje szczęście</p>
    </div>
    <span class="version">v1.2.1</span>
    <button type="button" id="btn-settings" class="btn btn-ghost settings-btn" title="Ustawienia" aria-label="Ustawienia">⚙️</button>
  </header>

  <main class="layout">
    <section class="wheel-area">
      <div class="wheel-wrap">
        <canvas id="wheel" width="520" height="520" role="img" aria-label="Koło ruletki"></canvas>
        <div class="pointer" aria-hidden="true"></div>
      </div>
      <div id="result" class="result">Naciśnij „Start”, aby zakręcić</div>
      <div id="round-info" class="round-info"></div>
      <div class="controls">
        <button type="button" id="btn-spin" class="btn btn-primary">🎡 Start</button>
      </div>
    </section>
  </main>

  <footer class="foot">© Ruletka v1.2.1</footer>

  <!-- Okno ustawień -->
  <div id="settings-overlay" class="overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-head">
        <h2 id="settings-title">⚙️ Ustawienia ruletki</h2>
        <button type="button" id="btn-close-settings" class="btn btn-ghost" aria-label="Zamknij">✕</button>
      </div>
      <div class="modal-body">
        <section>
          <h3>🎯 Wybory <span class="hint">— pola na kole</span></h3>
          <div id="choices-list"></div>
          <button type="button" id="btn-add-choice" class="btn btn-small">+ Dodaj wybór</button>
        </section>

        <section>
          <h3>🎰 Kolejność rund <span class="hint">— każda para to 2 obroty: najpierw pierwsze imię, potem drugie</span></h3>
          <div id="pairs-list"></div>
          <button type="button" id="btn-add-pair" class="btn btn-small">+ Dodaj rundę</button>
        </section>
      </div>
      <div class="modal-foot">
        <button type="button" id="btn-restore-defaults" class="btn btn-danger">Przywróć domyślne</button>
        <button type="button" id="btn-save-settings" class="btn btn-primary">💾 Zapisz</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
